[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adascope"
version = "1.0.0"
description = "Analyse von ADAS-HMI-Videos: Spurerkennung, Bodenebene, Fahrzeugtracking und Cut-In-Ereignisse aus mehreren Perspektiven"
requires-python = ">=3.10"
dependencies = [
    "ultralytics>=8.3.0",
    "supervision>=0.25.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "tqdm>=4.66.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
gui = ["PyQt6>=6.7"]            # adascope tool (Dataset Forge)
download = ["yt-dlp>=2025.1.1"] # adascope download

[project.scripts]
adascope = "adascope.cli.__main__:main"

[tool.setuptools.packages.find]
include = ["adascope*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]
